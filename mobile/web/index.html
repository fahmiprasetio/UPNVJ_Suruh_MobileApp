<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="UPNVJ Suruh, layanan titip dan antar di sekitar kampus.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UPNVJ Suruh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UPNVJ Suruh</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Tata letak bersih dan responsif:
    Memastikan kanvas Flutter dan kontainer induk selalu mengisi 100% viewport perangkat
    tanpa penguncian posisi tetap yang merusak kalkulasi visualViewport di mobile simulator/iframe.
  -->
  <style>
    :root:not(#_never_match_),
    html:root:not(#_never_match_),
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      overflow: hidden !important;
      overflow-x: hidden !important;
      background-color: #000000 !important;
      -webkit-text-size-adjust: 100% !important;
      touch-action: manipulation !important;
      zoom: 1 !important;
      transform: none !important;
      contain: layout size !important;
      box-sizing: border-box !important;
    }

    flutter-view {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      inset: 0 !important;
    }
  </style>

  <script>
    // Optimasi performa tinggi untuk Mobile Simulator & browser mobile:
    // Mencegah freeze/lag dengan penanganan shadow DOM satu kali tanpa infinite loop.
    (function() {
      function patchShadow(view) {
        if (!view || !view.shadowRoot || view.shadowRoot.querySelector('#flt-mobile-sim-fix')) return;
        var style = document.createElement('style');
        style.id = 'flt-mobile-sim-fix';
        style.textContent = [
          'flt-scene-host, flt-glass-pane, flt-scene {',
          '  width: 100% !important;',
          '  height: 100% !important;',
          '  min-width: 100% !important;',
          '  min-height: 100% !important;',
          '  max-width: 100% !important;',
          '  max-height: 100% !important;',
          '  position: absolute !important;',
          '  inset: 0 !important;',
          '}',
          'canvas {',
          '  width: 100% !important;',
          '  height: 100% !important;',
          '  position: absolute !important;',
          '  inset: 0 !important;',
          '}'
        ].join('\n');
        view.shadowRoot.appendChild(style);
      }

      function setupAllViews() {
        var views = document.querySelectorAll('flutter-view');
        for (var i = 0; i < views.length; i++) {
          patchShadow(views[i]);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupAllViews);
      } else {
        setupAllViews();
      }

      // Observer ringan hanya saat elemen flutter-view pertama kali dimasukkan ke DOM
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeType === 1) {
              if (node.tagName === 'FLUTTER-VIEW') {
                patchShadow(node);
              } else if (node.querySelector) {
                var v = node.querySelector('flutter-view');
                if (v) patchShadow(v);
              }
            }
          }
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });

      // Putus observer setelah 8 detik agar 0% CPU overhead setelah Flutter selesai bootstrap
      setTimeout(function() {
        setupAllViews();
        observer.disconnect();
      }, 8000);
    })();
  </script>
</head>
<body>
  <script>
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
