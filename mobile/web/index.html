<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="UPNVJ Suruh, layanan titip dan antar di sekitar kampus.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UPNVJ Suruh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UPNVJ Suruh</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Memastikan kanvas Flutter selalu memenuhi 100% viewport perangkat,
    mencegah masalah penyusutan skala (shrinking) di simulator ponsel atau iframe.
  -->
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      background-color: #FFFFFF;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    flutter-view, flt-glass-pane, flt-scene-host {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <script>
    // Memastikan kanvas Flutter selalu sinkron dengan ukuran simulator ponsel / iframe
    (function() {
      function syncFlutterBounds() {
        window.dispatchEvent(new Event('resize'));
        var views = document.querySelectorAll('flutter-view, flt-glass-pane');
        views.forEach(function(el) {
          el.style.width = '100%';
          el.style.height = '100%';
        });
      }

      window.addEventListener('resize', syncFlutterBounds);
      window.addEventListener('orientationchange', function() {
        setTimeout(syncFlutterBounds, 100);
      });

      if (window.ResizeObserver) {
        var ro = new ResizeObserver(function() {
          syncFlutterBounds();
        });
        ro.observe(document.documentElement);
      }
    })();

    // Pastikan browser TIDAK menahan cache lama: unregister service worker & bersihkan cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
