<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="UPNVJ Suruh, layanan titip dan antar di sekitar kampus.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UPNVJ Suruh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UPNVJ Suruh</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Tata letak bersih dan responsif:
    Memastikan kanvas Flutter dan kontainer induk selalu mengisi 100% viewport perangkat
    tanpa penguncian posisi tetap yang merusak kalkulasi visualViewport di mobile simulator/iframe.
  -->
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      overflow: hidden !important;
      background-color: #F8F9FA !important;
      -webkit-text-size-adjust: 100% !important;
      touch-action: none !important;
      overscroll-behavior: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      box-sizing: border-box !important;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    canvas {
      display: block !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      inset: 0 !important;
      touch-action: none !important;
      overscroll-behavior: none !important;
    }
  </style>

  <script>
    (function() {
      // Injeksi stylesheet ke shadowRoot flt-glass-pane agar canvas WebGL / CanvasKit selalu 100%
      function injectGlassPaneFix() {
        var glassPanes = document.querySelectorAll('flt-glass-pane');
        for (var i = 0; i < glassPanes.length; i++) {
          var gp = glassPanes[i];
          if (gp && gp.shadowRoot && !gp.shadowRoot.querySelector('#flt-viewport-fix')) {
            var st = document.createElement('style');
            st.id = 'flt-viewport-fix';
            st.textContent = [
              'flt-scene-host, flt-scene {',
              '  width: 100% !important;',
              '  height: 100% !important;',
              '  position: absolute !important;',
              '  inset: 0 !important;',
              '  touch-action: none !important;',
              '}',
              'canvas {',
              '  width: 100% !important;',
              '  height: 100% !important;',
              '  position: absolute !important;',
              '  inset: 0 !important;',
              '  touch-action: none !important;',
              '}'
            ].join('\n');
            gp.shadowRoot.appendChild(st);
          }
        }
      }

      function notifyResize() {
        injectGlassPaneFix();
        window.dispatchEvent(new Event('resize'));
      }

      // Sinkronisasi berkala di detik-detik awal bootstrap Flutter & ekstensi Mobile Simulator
      var intervals = [50, 150, 300, 600, 1000, 1800, 3000];
      intervals.forEach(function(delay) {
        setTimeout(notifyResize, delay);
      });

      window.addEventListener('resize', injectGlassPaneFix);
      window.addEventListener('orientationchange', function() {
        setTimeout(notifyResize, 100);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', notifyResize);
      }

      // Observer saat flt-glass-pane dimasukkan ke DOM
      var observer = new MutationObserver(function() {
        injectGlassPaneFix();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });

      setTimeout(function() {
        injectGlassPaneFix();
        observer.disconnect();
      }, 10000);
    })();
  </script>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
