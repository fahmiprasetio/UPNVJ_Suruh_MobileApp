# Xmx8G ditulis ulang jadi Xmx3G. Mesin pengembangan ini cuma punya RAM 7,8 GB total
# (CATATAN_DEV bagian 3), dan 8 GB itu baru heap daemon Gradle sendiri, sebelum daemon
# Kotlin (yang mengalokasikan heap-nya sendiri secara terpisah), IDE, dan peramban ikut
# menyala di mesin yang sama. Build rilis pertama di mesin ini sukses memakai angka lama
# (18 menit, lihat rencana capstone bagian 39), tapi itu satu kali percobaan dengan
# sesedikit mungkin proses lain menyala, bukan bukti bahwa 8 GB aman dipakai sehari-hari.
# 3G+1G(metaspace)+256m(code cache) menyisakan ruang untuk proses lain di mesin ber-RAM
# segini, dan itu yang justru menentukan apakah build ini bisa diulang tanpa macet OOM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
